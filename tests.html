<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .photo-container-1, .photo-container-2 {
            height: 125px;
            position: relative;
        }
        .photo {
            transition: all 0.3s ease;
        }
        .test-1, .test-2, .test-3 {
            width: 100px;
            height: 100px;
        }
        .test-1 {
            position: absolute;
            background-color: red;
            z-index: 0;
        }
        .test-2 {
            position: absolute;
            top: 3px;
            left: 3px;
            background-color: purple;
            z-index: 1;
        }
        .test-3 {
            position: absolute;
            top: 6px;
            left: 6px;
            background-color: pink;
            z-index: 2;
        }
    </style>
    <script src="/test.js" async></script>
</head>
<body>
    <div class="photo-container-1">
        <div class="photo test-1"></div>
        <div class="photo test-2"></div>
        <div class="photo test-3"></div>
    </div>
    <div class="photo-container-2">
        <div class="photo test-1"></div>
        <div class="photo test-2"></div>
        <div class="photo test-3"></div>
    </div>
</body>
</html>
